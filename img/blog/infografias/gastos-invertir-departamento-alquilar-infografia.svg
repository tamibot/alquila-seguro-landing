<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Infografía de gastos para invertir y alquilar</title>
  <desc id="desc">Resumen visual de estructura de costos y métricas de control para propietarios</desc>
  <defs>
    <linearGradient id="bgTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A3A5F"/>
      <stop offset="100%" stop-color="#1F87D8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F8FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(0,35,62,0.14)"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1160" height="720" rx="28" fill="#F6FAFF" stroke="#D4E4F2"/>
  <rect x="20" y="20" width="1160" height="150" rx="28" fill="url(#bgTop)"/>

  <text x="64" y="86" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800">Control de gastos para alquilar con rentabilidad</text>
  <text x="64" y="126" fill="#D8ECFF" font-family="'Segoe UI', Arial, sans-serif" font-size="23">Modelo simple para decidir, presupuestar y monitorear</text>

  <g transform="translate(50,196)" filter="url(#shadow)">
    <rect x="0" y="0" width="530" height="524" rx="22" fill="url(#panel)" stroke="#D6E6F3"/>
    <text x="24" y="44" fill="#11496F" font-family="'Segoe UI', Arial, sans-serif" font-size="29" font-weight="760">1) Estructura de costos (referencial)</text>

    <rect x="24" y="74" width="482" height="72" rx="14" fill="#EAF3FD"/>
    <text x="40" y="104" fill="#1A577F" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700">Costos de entrada</text>
    <text x="40" y="132" fill="#3B6480" font-family="'Segoe UI', Arial, sans-serif" font-size="19">Notaría, registro, alistamiento, implementación</text>

    <rect x="24" y="158" width="482" height="72" rx="14" fill="#E3F0FC"/>
    <text x="40" y="188" fill="#1A577F" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700">Costos recurrentes</text>
    <text x="40" y="216" fill="#3B6480" font-family="'Segoe UI', Arial, sans-serif" font-size="19">Mantenimiento, arbitrios, administración y vacancia</text>

    <rect x="24" y="242" width="482" height="72" rx="14" fill="#DCECFB"/>
    <text x="40" y="272" fill="#1A577F" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700">Costos variables</text>
    <text x="40" y="300" fill="#3B6480" font-family="'Segoe UI', Arial, sans-serif" font-size="19">Publicidad, reparaciones, rotación de inquilino</text>

    <rect x="24" y="326" width="482" height="72" rx="14" fill="#D5E8FA"/>
    <text x="40" y="356" fill="#1A577F" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700">Contingencias</text>
    <text x="40" y="384" fill="#3B6480" font-family="'Segoe UI', Arial, sans-serif" font-size="19">Reserva para imprevistos y desgaste del activo</text>

    <rect x="24" y="430" width="482" height="64" rx="14" fill="#CBE2F8"/>
    <text x="40" y="467" fill="#0E4B73" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700">Objetivo: proteger flujo neto, no solo renta bruta</text>
  </g>

  <g transform="translate(600,196)" filter="url(#shadow)">
    <rect x="0" y="0" width="550" height="250" rx="22" fill="url(#panel)" stroke="#D6E6F3"/>
    <text x="24" y="44" fill="#11496F" font-family="'Segoe UI', Arial, sans-serif" font-size="29" font-weight="760">2) Checklist previo a publicar</text>
    <g font-family="'Segoe UI', Arial, sans-serif" fill="#24546F">
      <rect x="24" y="66" width="502" height="40" rx="10" fill="#E8F2FC"/>
      <text x="42" y="92" font-size="21" font-weight="650">Proforma con 3 escenarios</text>
      <rect x="24" y="114" width="502" height="40" rx="10" fill="#E8F2FC"/>
      <text x="42" y="140" font-size="21" font-weight="650">Costo de cierre ya presupuestado</text>
      <rect x="24" y="162" width="502" height="40" rx="10" fill="#E8F2FC"/>
      <text x="42" y="188" font-size="21" font-weight="650">Rango de precio validado por mercado</text>
      <rect x="24" y="210" width="502" height="30" rx="10" fill="#D2E7FA"/>
      <text x="42" y="231" font-size="16" font-weight="650" fill="#1B5A83">Fondo de contingencia separado de caja operativa</text>
    </g>
  </g>

  <g transform="translate(600,470)" filter="url(#shadow)">
    <rect x="0" y="0" width="550" height="250" rx="22" fill="url(#panel)" stroke="#D6E6F3"/>
    <text x="24" y="44" fill="#11496F" font-family="'Segoe UI', Arial, sans-serif" font-size="29" font-weight="760">3) KPIs de control mensual</text>
    <g font-family="'Segoe UI', Arial, sans-serif" fill="#24546F">
      <rect x="24" y="70" width="502" height="44" rx="10" fill="#E8F2FC"/>
      <text x="42" y="98" font-size="22" font-weight="700">Vacancia mensual objetivo:</text>
      <text x="355" y="98" font-size="22">menor al 8%</text>

      <rect x="24" y="122" width="502" height="44" rx="10" fill="#E8F2FC"/>
      <text x="42" y="150" font-size="22" font-weight="700">Cobro puntual:</text>
      <text x="355" y="150" font-size="22">mayor al 95%</text>

      <rect x="24" y="174" width="502" height="44" rx="10" fill="#E8F2FC"/>
      <text x="42" y="202" font-size="22" font-weight="700">Desviación de gastos:</text>
      <text x="355" y="202" font-size="22">menor al 10%</text>
    </g>
  </g>
</svg>

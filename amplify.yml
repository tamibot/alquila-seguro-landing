version: 1
frontend:
  phases:
    build:
      commands:
        # Publica el sitio igual que antes, sin los archivos internos del repositorio.
        - rm -rf dist
        - mkdir dist
        - find . -mindepth 1 -maxdepth 1 ! -name dist ! -name .git -exec cp -R {} dist/ \;
        - rm -rf dist/scripts dist/mcp-integration dist/blog/image-briefs dist/node_modules
        - find dist -type f \( -name "*.md" -o -name "*.pdf" -o -name ".env*" -o -name ".gitignore" -o -name "package*.json" -o -name "amplify.yml" -o -name "*.prompt.*" -o -name "*.qa.json" -o -name "*.mjs" -o -name ".DS_Store" \) -delete
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
